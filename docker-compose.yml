version: '3.8'

services:
  # 1. FastAPI REST API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventscout_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-eventscout}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # 2. Automated Background Scraper & Digest Worker
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventscout_scheduler
    restart: unless-stopped
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-eventscout}
      - SCRAPE_INTERVAL_HOURS=${SCRAPE_INTERVAL_HOURS:-6}
      - DAILY_DIGEST_HOUR=${DAILY_DIGEST_HOUR:-8}
      - DAILY_DIGEST_MINUTE=${DAILY_DIGEST_MINUTE:-0}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
    command: ["python", "-m", "eventscout.scheduler"]
    depends_on:
      - api

  # 3. Next.js 15 Modern Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: eventscout_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
